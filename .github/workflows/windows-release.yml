name: Windows build

# Builds the web bundle on Linux and the Windows installers on a clean
# windows-latest runner, then installs, exercises and uninstalls them.
# Unsigned (DEVELOPMENT) by default. A SIGNED RELEASE build runs only when
# dispatched manually with `signed: true` and signing secrets configured.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign with the configured code-signing certificate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # type-check + Vite build + offline audit

  windows:
    runs-on: windows-latest
    needs: web
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci

      # Signing material exists only for the duration of the build step: it is
      # decoded from a protected secret into the runner's temp folder, used by
      # signtool via scripts/sign.mjs, and deleted right after (even on failure).
      - name: Prepare signing certificate
        if: ${{ inputs.signed }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SFIELD_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'signed=true but secret SFIELD_SIGN_PFX_BASE64 is not configured' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "SFIELD_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release artifacts
        shell: pwsh
        env:
          SFIELD_SIGN_PFX_PASSWORD: ${{ secrets.SFIELD_SIGN_PFX_PASSWORD }}
          SFIELD_TIMESTAMP_URL: ${{ vars.SFIELD_TIMESTAMP_URL }}
          SFIELD_PUBLISHER: ${{ vars.SFIELD_PUBLISHER }}
        run: |
          # A run requested as signed must never fall back to unsigned output:
          # release.mjs --signed fails on any signing or verification error.
          if ('${{ inputs.signed }}' -eq 'true') { node scripts/release.mjs --signed } else { node scripts/release.mjs }

      - name: Remove signing certificate
        if: ${{ always() && inputs.signed }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          if (Test-Path $pfx) { throw 'temporary certificate could not be removed' }
          Write-Host 'Temporary certificate removed.'

      - name: Signing guard - a signed build without a certificate must fail
        if: ${{ !inputs.signed }}
        shell: pwsh
        run: |
          $env:SFIELD_SIGN_THUMBPRINT = $null; $env:SFIELD_SIGN_PFX = $null; $env:SFIELD_SIGN_COMMAND = $null
          node scripts/release.mjs --signed --skip-tests *> $null
          if ($LASTEXITCODE -eq 0) { throw 'release.mjs --signed succeeded without a certificate' }
          Write-Host "release.mjs --signed without certificate: exit $LASTEXITCODE (refused, as required)"
          node scripts/sign.mjs dist/release/SoundwavianField.exe *> $null
          if ($LASTEXITCODE -eq 0) { throw 'sign.mjs ran without a certificate' }
          Write-Host "sign.mjs without certificate: exit $LASTEXITCODE (refused, as required)"
          if (-not (Test-Path dist/release/SoundwavianField.exe)) { throw 'guard test damaged the release output' }
          # The refusals above leave $LASTEXITCODE = 1 on purpose; the step itself succeeded.
          exit 0

      - name: Clippy (deny warnings)
        shell: pwsh
        run: cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Static inspection (MSI tables, payload, imports, signatures)
        shell: pwsh
        run: ./scripts/windows/inspect-release.ps1

      - name: Release test - MSI installer
        shell: pwsh
        env:
          SFIELD_PUBLISHER: ${{ vars.SFIELD_PUBLISHER }}
          SFIELD_EXPECT_SIGNED: ${{ inputs.signed }}
        run: ./scripts/windows/smoke-test.ps1 -Installer (Get-ChildItem dist/release/SoundwavianField-*.msi).FullName

      - name: Release test - setup.exe installer
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          SFIELD_PUBLISHER: ${{ vars.SFIELD_PUBLISHER }}
          SFIELD_EXPECT_SIGNED: ${{ inputs.signed }}
        run: ./scripts/windows/smoke-test.ps1 -Installer (Get-ChildItem dist/release/SoundwavianField-Setup-*.exe).FullName

      - name: Print release summary into the log
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "===== dist/release ====="
          Get-ChildItem dist/release -File | ForEach-Object {
            Write-Host ("{0,-40} {1,12:N0} bytes  {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())
          }
          foreach ($f in 'BUILD_INFO.txt', 'SHA256SUMS.txt', 'README-FIRST.txt', 'reports/defender-scan.txt', 'reports/smoke-test-msi.txt', 'reports/smoke-test-nsis.txt', 'reports/inspection.txt') {
            $p = Join-Path dist/release $f
            if (Test-Path $p) { Write-Host "`n===== $f ====="; Get-Content $p | Write-Host }
          }
          $nsi = 'dist/release/reports/installer-sources/nsis-installer.nsi'
          if (Test-Path $nsi) {
            Write-Host "`n===== NSIS installer: registry, shortcuts, exec ====="
            Select-String -Path $nsi -Pattern 'WriteReg|DeleteReg|CreateShortcut|Exec|nsExec|ExecShell|Download' | ForEach-Object { Write-Host ("{0,5}: {1}" -f $_.LineNumber, $_.Line.Trim()) }
          }

      # Private CI artifact only (visible to repository members); nothing is
      # published as a GitHub Release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundwavian-field-windows
          path: dist/release/
          if-no-files-found: warn
